[package]
name = "yt-audio-downloader"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Developer <dev@antigravity.ai>"]
description = "A powerful, asynchronous Rust library for downloading audio from YouTube."
keywords = ["youtube", "audio", "downloader", "mp3", "yt-dlp"]
categories = ["multimedia::audio", "asynchronous"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
futures-util = "0.3"
url = "2.5"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1.6"

[[example]]
name = "simple_download"
path = "examples/simple_download.rs"

[[example]]
name = "custom_options"
path = "examples/custom_options.rs"

[[example]]
name = "stream_audio"
path = "examples/stream_audio.rs"
