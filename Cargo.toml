[package]
name = "yt-audio-downloader"
version = "0.1.0"
edition = "2024"
description = "An asynchronous Rust library for downloading audio from YouTube."
repository = "https://github.com/IVKLD/yt-audio-downloader-rs.git"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "query", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
futures-util = "0.3.32"
url = "2.5.8"
regex = "1.12.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1.12"

[[example]]
name = "simple_download"
path = "examples/simple_download.rs"

[[example]]
name = "custom_options"
path = "examples/custom_options.rs"

[[example]]
name = "stream_audio"
path = "examples/stream_audio.rs"
